<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#64789b" stop-opacity=".10"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1120" height="440" rx="28" fill="#111827"/>
  <g font-family="sans-serif" fill="#fff">
    <text x="185" y="55" text-anchor="middle" font-size="24">静止</text>
    <text x="560" y="55" text-anchor="middle" font-size="24">悬停</text>
    <text x="935" y="55" text-anchor="middle" font-size="24">按下 / 回弹</text>
  </g>
  <g transform="translate(45 95)">
    <rect width="280" height="190" rx="24" fill="url(#panel)" stroke="#fff" stroke-opacity=".24"/>
    <rect x="20" y="25" width="240" height="58" rx="12" fill="#fff" fill-opacity=".02" stroke="#fff" stroke-opacity=".10"/>
    <text x="36" y="50" fill="#dce8ff" font-family="sans-serif" font-size="14">两行文本内容示例，超出后…</text>
    <text x="36" y="70" fill="#dce8ff" font-family="sans-serif" font-size="14">保留一个置顶按钮</text><circle cx="235" cy="55" r="10" fill="#fff" fill-opacity=".28"/>
  </g>
  <g transform="translate(420 87) scale(1.03)" filter="url(#glow)">
    <rect width="280" height="190" rx="24" fill="url(#panel)" stroke="#fff" stroke-opacity=".50"/>
    <rect x="20" y="25" width="240" height="58" rx="12" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".30"/>
    <text x="36" y="50" fill="#fff" font-family="sans-serif" font-size="14">轻微放大 1.015 · 边缘泛光</text>
    <text x="36" y="70" fill="#fff" font-family="sans-serif" font-size="14">不使用持续色相旋转</text><circle cx="235" cy="55" r="10" fill="#fff" fill-opacity=".65"/>
  </g>
  <g transform="translate(810 105) scale(.97)">
    <rect width="280" height="190" rx="24" fill="url(#panel)" stroke="#fff" stroke-opacity=".38"/>
    <rect x="20" y="25" width="240" height="58" rx="12" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".24"/>
    <text x="36" y="50" fill="#fff" font-family="sans-serif" font-size="14">按下缩小到 0.975</text>
    <text x="36" y="70" fill="#fff" font-family="sans-serif" font-size="14">松开使用 EaseOutBack 回弹</text><circle cx="235" cy="55" r="10" fill="#fff" fill-opacity=".48"/>
  </g>
  <path d="M330 190 H395" stroke="#9ecbff" stroke-width="3" marker-end="url(#a)"/><path d="M710 190 H785" stroke="#9ecbff" stroke-width="3"/>
  <text x="560" y="385" text-anchor="middle" fill="#bcd7ff" font-family="sans-serif" font-size="19">Uiverse 动画思路 → GJS / Clutter 安全移植</text>
</svg>
