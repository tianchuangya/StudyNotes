name: Build Windows Receiver
on:
  workflow_dispatch:
  push:
    tags: ["win*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name IslandSyncReceiver island_sync_receiver.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/IslandSyncReceiver.exe
      - uses: actions/upload-artifact@v4
        with:
          name: IslandSyncReceiver-exe
          path: dist/IslandSyncReceiver.exe
