<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 28px sans-serif;fill:#1f2937}.sub{font:18px sans-serif;fill:#475569}
      .node{stroke-width:2}.label{font:700 19px sans-serif;fill:#1f2937;text-anchor:middle;dominant-baseline:middle}
      .edge{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .hint{font:17px sans-serif;fill:#166534}
    </style>
  </defs>
  <rect width="1040" height="600" rx="8" fill="#ffffff"/>
  <text x="50" y="55" class="title">超文本：由超链接形成的非线性有向网络</text>
  <text x="50" y="88" class="sub">读者可从当前文档沿任意可用链接跳转，没有唯一的固定阅读顺序</text>

  <path class="edge" d="M500 285 C390 225 310 190 220 165"/>
  <path class="edge" d="M500 300 C380 310 285 325 205 355"/>
  <path class="edge" d="M540 270 C650 205 745 175 835 160"/>
  <path class="edge" d="M555 315 C665 335 750 375 835 420"/>
  <path class="edge" d="M240 175 C390 130 630 120 805 155"/>
  <path class="edge" d="M815 410 C660 475 430 475 245 375"/>
  <path class="edge" d="M205 335 C175 270 175 225 205 185"/>

  <rect x="425" y="245" width="190" height="105" rx="8" fill="#ccfbf1" stroke="#0f766e" class="node"/>
  <text x="520" y="286" class="label">当前 HTML 文档</text>
  <text x="520" y="317" class="label">（链接起点）</text>

  <rect x="90" y="120" width="180" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" class="node"/>
  <text x="180" y="165" class="label">文本资料</text>
  <rect x="80" y="320" width="190" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" class="node"/>
  <text x="175" y="365" class="label">图片 / 视频</text>
  <rect x="780" y="115" width="190" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" class="node"/>
  <text x="875" y="160" class="label">另一网页</text>
  <rect x="780" y="385" width="190" height="90" rx="8" fill="#f3e8ff" stroke="#7e22ce" class="node"/>
  <text x="875" y="430" class="label">下载资源</text>

  <text x="55" y="540" class="hint">关键：放射状是常见外观，“无序”指没有唯一线性顺序；箭头仍表示明确的链接方向。</text>
</svg>
