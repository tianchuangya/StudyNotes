<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="705" viewBox="70 745 1260 705">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .panel-title { font-size: 25px; font-weight: 700; fill: #155e75; }
      .layer { font-size: 22px; font-weight: 700; }
      .detail { font-size: 17px; fill: #475569; }
      .small { font-size: 16px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .cyan { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .purple { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; }
      .green { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .red { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .map { stroke: #7e22ce; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7e22ce"/>
    </marker>
  </defs>

  <rect width="1400" height="1880" fill="#f8fafc"/>
  <text x="700" y="62" text-anchor="middle" class="title">Internet 分层模型、OSI 对照与数据封装</text>

  <!-- Panel 1 -->
  <rect x="70" y="105" width="1260" height="590" rx="8" class="panel"/>
  <text x="110" y="155" class="panel-title">A. Internet 五层协议栈与数据单元</text>

  <rect x="310" y="190" width="780" height="78" rx="6" class="purple"/>
  <text x="700" y="222" text-anchor="middle" class="layer">应用层</text>
  <text x="700" y="249" text-anchor="middle" class="detail">应用进程之间 · 报文 Message</text>
  <path d="M700 268 V292" class="arrow"/>

  <rect x="310" y="305" width="780" height="78" rx="6" class="cyan"/>
  <text x="700" y="337" text-anchor="middle" class="layer">传输层</text>
  <text x="700" y="364" text-anchor="middle" class="detail">进程到进程 · TCP 报文段 / UDP 数据报</text>
  <path d="M700 383 V407" class="arrow"/>

  <rect x="310" y="420" width="780" height="78" rx="6" class="red"/>
  <text x="700" y="452" text-anchor="middle" class="layer">网络层</text>
  <text x="700" y="479" text-anchor="middle" class="detail">主机到主机 · IP 数据报 / 分组 Packet</text>
  <path d="M700 498 V522" class="arrow"/>

  <rect x="310" y="535" width="780" height="78" rx="6" class="green"/>
  <text x="700" y="567" text-anchor="middle" class="layer">链路层</text>
  <text x="700" y="594" text-anchor="middle" class="detail">相邻节点之间 · 帧 Frame</text>
  <path d="M700 613 V637" class="arrow"/>

  <rect x="310" y="650" width="780" height="78" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="700" y="682" text-anchor="middle" class="layer">物理层</text>
  <text x="700" y="709" text-anchor="middle" class="detail">单条物理链路 · 比特 Bit</text>

  <!-- Panel 2 -->
  <rect x="70" y="745" width="1260" height="705" rx="8" class="panel"/>
  <text x="110" y="795" class="panel-title">B. OSI 七层与 Internet 五层的对应关系</text>
  <text x="350" y="840" text-anchor="middle" class="layer">OSI 七层参考模型</text>
  <text x="1045" y="840" text-anchor="middle" class="layer">Internet 五层模型</text>

  <g>
    <rect x="145" y="875" width="410" height="58" rx="6" class="purple"/><text x="350" y="911" text-anchor="middle" class="layer">应用层</text>
    <rect x="145" y="950" width="410" height="58" rx="6" class="purple"/><text x="350" y="986" text-anchor="middle" class="layer">表示层</text>
    <rect x="145" y="1025" width="410" height="58" rx="6" class="purple"/><text x="350" y="1061" text-anchor="middle" class="layer">会话层</text>
    <rect x="145" y="1100" width="410" height="58" rx="6" class="cyan"/><text x="350" y="1136" text-anchor="middle" class="layer">传输层</text>
    <rect x="145" y="1175" width="410" height="58" rx="6" class="red"/><text x="350" y="1211" text-anchor="middle" class="layer">网络层</text>
    <rect x="145" y="1250" width="410" height="58" rx="6" class="green"/><text x="350" y="1286" text-anchor="middle" class="layer">数据链路层</text>
    <rect x="145" y="1325" width="410" height="58" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="350" y="1361" text-anchor="middle" class="layer">物理层</text>
  </g>

  <g>
    <rect x="840" y="875" width="410" height="208" rx="6" class="purple"/>
    <text x="1045" y="946" text-anchor="middle" class="layer">应用层</text>
    <text x="1045" y="980" text-anchor="middle" class="detail">包含应用、表示、会话功能</text>
    <text x="1045" y="1015" text-anchor="middle" class="small">功能合并，不代表功能消失</text>
    <rect x="840" y="1100" width="410" height="58" rx="6" class="cyan"/><text x="1045" y="1136" text-anchor="middle" class="layer">传输层</text>
    <rect x="840" y="1175" width="410" height="58" rx="6" class="red"/><text x="1045" y="1211" text-anchor="middle" class="layer">网络层</text>
    <rect x="840" y="1250" width="410" height="58" rx="6" class="green"/><text x="1045" y="1286" text-anchor="middle" class="layer">链路层</text>
    <rect x="840" y="1325" width="410" height="58" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="1045" y="1361" text-anchor="middle" class="layer">物理层</text>
  </g>

  <path d="M555 904 C680 904 715 930 840 930" class="map"/>
  <path d="M555 979 C680 979 715 979 840 979" class="map"/>
  <path d="M555 1054 C680 1054 715 1028 840 1028" class="map"/>
  <path d="M555 1129 H840" class="map"/>
  <path d="M555 1204 H840" class="map"/>
  <path d="M555 1279 H840" class="map"/>
  <path d="M555 1354 H840" class="map"/>

  <!-- Panel 3 -->
  <rect x="70" y="1500" width="1260" height="300" rx="8" class="panel"/>
  <text x="110" y="1550" class="panel-title">C. 发送端逐层封装时的数据单元变化</text>

  <rect x="105" y="1610" width="205" height="100" rx="6" class="purple"/>
  <text x="207" y="1652" text-anchor="middle" class="layer">应用层</text>
  <text x="207" y="1684" text-anchor="middle" class="detail">报文</text>
  <path d="M310 1660 H352" class="arrow"/>

  <rect x="365" y="1610" width="205" height="100" rx="6" class="cyan"/>
  <text x="467" y="1652" text-anchor="middle" class="layer">传输层</text>
  <text x="467" y="1684" text-anchor="middle" class="detail">报文段 / 数据报</text>
  <path d="M570 1660 H612" class="arrow"/>

  <rect x="625" y="1610" width="205" height="100" rx="6" class="red"/>
  <text x="727" y="1652" text-anchor="middle" class="layer">网络层</text>
  <text x="727" y="1684" text-anchor="middle" class="detail">IP 数据报 / 分组</text>
  <path d="M830 1660 H872" class="arrow"/>

  <rect x="885" y="1610" width="180" height="100" rx="6" class="green"/>
  <text x="975" y="1652" text-anchor="middle" class="layer">链路层</text>
  <text x="975" y="1684" text-anchor="middle" class="detail">帧</text>
  <path d="M1065 1660 H1107" class="arrow"/>

  <rect x="1120" y="1610" width="175" height="100" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="1207" y="1652" text-anchor="middle" class="layer">物理层</text>
  <text x="1207" y="1684" text-anchor="middle" class="detail">比特</text>

  <text x="700" y="1765" text-anchor="middle" class="small">发送端从上到下添加控制信息；接收端按相反方向逐层解封装。</text>
</svg>
